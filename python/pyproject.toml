[project]
name = "ssf2-rl"
version = "0.1.0"
description = "RL research bridge client for the instrumented SSF2 (ReFlash2) research build"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
rl = ["gymnasium>=0.29", "torch>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ssf2_rl*"]
